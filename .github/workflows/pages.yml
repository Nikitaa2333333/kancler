# Тестовая выкладка на GitHub Pages: https://nikitaa2333333.github.io/kancler/
# Боевой хостинг будет SprintHost (скилл sprinthost-deploy) — тогда добавится второй
# job с rsync, а PUBLIC_BASE для него не задаём (сайт с корня домена).
name: Публикация на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Сборка
        run: npm run build
        env:
          # Проектный сайт живёт в подпапке /kancler — префикс для ссылок и картинок
          PUBLIC_BASE: /kancler
          PUBLIC_SITE: https://nikitaa2333333.github.io/kancler
          PUBLIC_INDEXING: 'false'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
